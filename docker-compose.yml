version: '3.8'

services:
  database:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: meetup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: new_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./server 
      dockerfile: Dockerfile 
    depends_on:
      database:
        condition: service_healthy
    command: ["npm","run","dev"]
    ports:
      - "4000:4000"
    networks:
      - app-network

  peerserver:
    build: 
      context: ./peerjsserver 
      dockerfile: Dockerfile
    depends_on:
      - backend
    command: ["npm","run","start"]
    ports:
      - "9000:9000"
    networks:
      - app-network

  frotend:
    build: 
      context: ./client
      dockerfile: Dockerfile 
    depends_on:
      - peerserver 
    command: ["npm" ,"run","dev"]
    ports:
      - "3000:3000"
    networks:
      - app-network

# Define the network
networks:
  app-network:
    driver: bridge

# Define a volume for persistent database storage
volumes:
  postgres_data:
